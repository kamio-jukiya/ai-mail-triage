# 定期実行。平日の9時・13時・17時（JST）に受信メールを振り分ける。
#
# シークレットを使うのはこのワークフローだけで、pull_request では動かさない。
# フォークからのPRでシークレットが読み出される経路を作らないため。
#
# 処理済みIDは artifact として実行間で引き継ぐ。
# 本来は外部ストレージ（S3 / DynamoDB など）に置くべきだが、
# この規模なら artifact で十分で、追加の課金対象を増やさずに済む。
name: メール振り分け

on:
  schedule:
    # UTC 表記。JST の 9:00 / 13:00 / 17:00 に相当する
    - cron: "0 0,4,8 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "書き込みを行わず分類結果だけ確認する"
        type: boolean
        default: false

# リポジトリへの書き込みは行わない。artifact の読み書きはこの権限とは別枠
permissions:
  contents: read

# 実行が重ならないようにする。重なると同じメールを二重に処理しかける
# （冪等性の仕組みで防いではいるが、そもそも重ねない）
concurrency:
  group: triage
  cancel-in-progress: false

jobs:
  triage:
    # 稼働スイッチ。Variables に TRIAGE_ENABLED=true を登録するまで実行されない。
    # 設定が済んでいない状態で定期実行が空振りし続けるのを防ぐと同時に、
    # 「止めたいときに1箇所を変えれば止まる」場所を用意しておく意味もある。
    if: vars.TRIAGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # SHA固定の理由は ci.yml のコメントを参照
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.x"
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: 前回までの処理済みIDを取得
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        continue-on-error: true # 初回実行では存在しないので失敗して良い
        with:
          name: triage-state
          path: state

      - name: 実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Google Workspace（サービスアカウント方式）を使う場合
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_USER: ${{ vars.GMAIL_USER }}
          # 個人のGmail（OAuth方式）を使う場合
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_AUTH_MODE: ${{ vars.GOOGLE_AUTH_MODE }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY }}
          SHEETS_SPREADSHEET_ID: ${{ vars.SHEETS_SPREADSHEET_ID }}
          SHEETS_RANGE: ${{ vars.SHEETS_RANGE }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
          TRIAGE_MAX_MESSAGES: ${{ vars.TRIAGE_MAX_MESSAGES }}
          TRIAGE_CONFIDENCE_THRESHOLD: ${{ vars.TRIAGE_CONFIDENCE_THRESHOLD }}
          # 実行ログに件名・差出人を出さない。
          # 公開リポジトリの Actions 実行ログは誰でも読めるため、既定のまま（false）にしておく
          TRIAGE_LOG_CONTENT: "false"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run dry-run
          else
            npm start
          fi

      - name: 処理済みIDを保存
        if: always() # 途中で失敗しても、そこまでの処理済みIDは残す
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: triage-state
          path: state/
          retention-days: 90
          overwrite: true
